# =============================================================================
# CrashBet Hub — Apache VirtualHost config for aviator.betcheza.co.ke
#
# Add this inside your existing VirtualHost block for aviator.betcheza.co.ke
# or save to: /etc/httpd/conf.d/aviator.betcheza.co.ke.conf
# Then run: systemctl reload httpd   (or: service httpd reload)
# =============================================================================

<VirtualHost *:80>
    ServerName aviator.betcheza.co.ke
    DocumentRoot /home/admin/domains/aviator.betcheza.co.ke/public_html

    # Enable proxy modules (required for Node.js API proxying)
    # These must be loaded globally in httpd.conf if not already:
    #   LoadModule proxy_module modules/mod_proxy.so
    #   LoadModule proxy_http_module modules/mod_proxy_http.so

    # ── SSE (Server-Sent Events) — MUST come before the general /api rule ─────
    # flushpackets=on tells Apache to forward each SSE packet immediately
    # instead of buffering the response. Without this the game stream will
    # appear to hang in the browser.
    ProxyPass /api/game/stream http://127.0.0.1:3001/api/game/stream flushpackets=on
    ProxyPassReverse /api/game/stream http://127.0.0.1:3001/api/game/stream

    # ── General API proxy ─────────────────────────────────────────────────────
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api

    # ── Serve React SPA ───────────────────────────────────────────────────────
    <Directory /home/admin/domains/aviator.betcheza.co.ke/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/aviator-error.log
    CustomLog /var/log/httpd/aviator-access.log combined
</VirtualHost>
